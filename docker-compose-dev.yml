version: "3.9"

networks:
  sapl-net-dev:
    name: sapl-net-dev
    driver: bridge

volumes:
  sapldb_data:
  mayan_app:
  mayan_db:
  mayan_results:
  mayan_broker:

services:
  # --- SAPL ---
  sapldb-dev:
    image: postgres:10.5-alpine
    container_name: sapldb-dev
    environment:
      POSTGRES_PASSWORD: sapl
      POSTGRES_USER: sapl
      POSTGRES_DB: sapl
    ports:
      - "5434:5432"
    networks: [sapl-net-dev]

  sapl-dev:
    build:
      context: .
      dockerfile: Dockerfiledev
    image: sapl:dev
    container_name: sapl-dev
    command: python3 manage.py runserver 0.0.0.0:8000
    env_file:
      - ./sapl/.env.sapl
    volumes:
      - .:/sapl-dev
    depends_on:
      - sapldb-dev
    ports:
      - "8080:8000"
    networks: [ sapl-net-dev ]


    # --- MAYAN EDMS (usa imagem oficial, sem clone) ---
  mayan-postgres:
    image: postgres:13-alpine
    environment:
      POSTGRES_DB: mayan
      POSTGRES_USER: mayan
      POSTGRES_PASSWORD: mayanpass
    volumes:
      - mayan_db:/var/lib/postgresql/data
    networks: [sapl-net-dev]

  mayan-redis:
    image: redis:6-alpine
    command: ["redis-server","--appendonly","no","--databases","2"]
    volumes:
      - mayan_results:/data
    networks: [sapl-net-dev]

  mayan-rabbitmq:
    image: rabbitmq:3-alpine
    hostname: mayan-rabbitmq
    volumes:
      - mayan_broker:/var/lib/rabbitmq
    networks: [sapl-net-dev]

  mayan:
    image: mayanedms/mayanedms:s4
    container_name: mayan
    depends_on:
      - mayan-postgres
      - mayan-redis
      - mayan-rabbitmq
    environment:
      MAYAN_DATABASES: |
        {
          "default": {
            "ENGINE": "django.db.backends.postgresql",
            "NAME": "mayan",
            "USER": "mayan", 
            "PASSWORD": "mayanpass",
            "HOST": "mayan-postgres",
            "PORT": "5432"
          }
        }
      MAYAN_CELERY_BROKER_URL: "redis://mayan-redis:6379/0"
      MAYAN_CELERY_RESULT_BACKEND: "redis://mayan-redis:6379/1"
    volumes:
      - mayan_app:/var/lib/mayan
    ports:
      - "8082:8000"
    networks: [ sapl-net-dev ]
