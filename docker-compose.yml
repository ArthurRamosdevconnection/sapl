version: "3.7"
services:
  # Consolidated PostgreSQL - serves both SAPL and Paperless
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "5437:5432"
    networks:
      - sapl-net


  # Consolidated Redis - serves both SAPL and Paperless
  redis:
    image: redis:8
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports:
      - "6380:6379"
    networks:
      - sapl-net

  saplsolr:
    image: solr:8.3
    restart: always
    command: bin/solr start -c -f
    volumes:
      - solr_data:/opt/solr/server/solr
      - solr_configsets:/opt/solr/server/solr/configsets
    ports:
      - "8983:8983"
    networks:
      - sapl-net

  sapl:
    image: interlegis/sapl:3.1.161-RC0
    #build: .
    restart: always
    environment:
      ADMIN_PASSWORD: interlegis
      ADMIN_EMAIL: email@dominio.net
      DEBUG: 'False'
      EMAIL_PORT: 587
      EMAIL_USE_TLS: 'False'
      EMAIL_HOST: smtp.dominio.net
      EMAIL_HOST_USER: usuariosmtp
      EMAIL_SEND_USER: usuariosmtp
      EMAIL_HOST_PASSWORD: senhasmtp
      USE_SOLR: 'True'
      SOLR_COLLECTION: sapl
      SOLR_URL: http://saplsolr:8983
      TZ: America/Sao_Paulo
      # Updated database connection
      DATABASE_URL: postgresql://sapl:sapl@postgres:5432/sapl
    volumes:
      - sapl_data:/var/interlegis/sapl/data
      - sapl_media:/var/interlegis/sapl/media
    depends_on:
      - postgres
      - saplsolr
      - redis
    ports:
      - "8020:80"
    networks:
      - sapl-net

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "8002:8000"
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - ./export:/usr/src/paperless/export
      - ./consume:/usr/src/paperless/consume
    environment:
      # Updated to use consolidated Redis (database 1 to separate from SAPL)
      PAPERLESS_REDIS: redis://redis:6379/1
      # Updated database connection
      PAPERLESS_DBHOST: postgres
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: paperless

networks:
  sapl-net:
    name: sapl-net
    driver: bridge

volumes:
  sapl_data:
  sapl_media:
  solr_data:
  solr_configsets:
  data:
  media:
  pgdata:
  redisdata: