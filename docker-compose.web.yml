version: "3.7"
services:
  saplsolr:
    image: solr:8.3
    restart: always
    command: bin/solr start -c -f
    volumes:
      - solr_data:/opt/solr/server/solr
      - solr_configsets:/opt/solr/server/solr/configsets
    ports:
      - "8983:8983"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8983/solr/admin/cores?action=STATUS || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  sapl:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: always
    volumes:
      - sapl_data:/var/interlegis/sapl/data
      - sapl_media:/var/interlegis/sapl/media
    ports:
      - "8020:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f postgres://postgres:3HSjV362HCxRNJZ1Y6rZAKwb1d3rdTbQmlVSJxgYpgCPTcpp2xgxa4eNGbL9jCro@72.60.63.25:5432/postgres || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    depends_on:
      saplsolr:
        condition: service_healthy

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    ports:
      - "8002:8000"
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - ./export:/usr/src/paperless/export
      - ./consume:/usr/src/paperless/consume
    healthcheck:
      test: ["CMD-SHELL", "curl -f postgres://postgres:3HSjV362HCxRNJZ1Y6rZAKwb1d3rdTbQmlVSJxgYpgCPTcpp2xgxa4eNGbL9jCro@72.60.63.25:5432/postgres || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 180s

volumes:
  sapl_data:
  sapl_media:
  solr_data:
  solr_configsets:
  data:
  media: