version: "3.7"
services:
  redis:
    image: redis:8
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports:
      - "6380:6379"
    networks:
      - sapl-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  sapl-net:
    external: true

volumes:
  redisdata:
